<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(
          135deg,
          #0a1929 0%,
          #1a3a52 50%,
          #2d5a7b 100%
        );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: #fff;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle at 30% 20%,
          rgba(45, 170, 220, 0.08) 0%,
          transparent 50%
        );
        pointer-events: none;
        animation: drift 20s ease-in-out infinite;
        z-index: 0;
      }

      @keyframes drift {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(20px, 20px);
        }
      }

      .header {
        position: relative;
        z-index: 50;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(10, 25, 41, 0.6);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .logo {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -1px;
        background: linear-gradient(120deg, #2daae0, #5ec8f2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .nav-links {
        display: flex;
        gap: 40px;
        list-style: none;
      }

      .nav-links a {
        text-decoration: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        font-weight: 600;
        transition: all 0.3s ease;
        padding: 8px 16px;
        border-radius: 8px;
      }

      .nav-links a:hover,
      .nav-links a.active {
        color: #2daae0;
        background: rgba(45, 170, 224, 0.1);
      }

      .container {
        flex: 1;
        padding: 40px;
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 30px;
        max-width: 1600px;
        margin: 0 auto;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .page-title {
        grid-column: 1 / -1;
        font-size: 36px;
        font-weight: 700;
        margin-bottom: 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
      }

      .card:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .card-title {
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 24px;
        color: #2daae0;
      }

      .chart-wrapper {
        position: relative;
        height: 320px;
        margin-bottom: 20px;
      }

      .model-selector {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .toggle-btn {
        padding: 12px 16px;
        border: none;
        background: rgba(45, 170, 224, 0.1);
        color: #2daae0;
        border: 1px solid rgba(45, 170, 224, 0.3);
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        transition: all 0.3s ease;
      }

      .toggle-btn.active {
        background: linear-gradient(135deg, #2daae0 0%, #5ec8f2 100%);
        color: white;
        border-color: #2daae0;
      }

      .toggle-btn:hover {
        transform: translateY(-2px);
      }

      .stats-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .stat-card {
        padding: 18px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s ease;
      }

      .stat-card:hover {
        background: rgba(45, 170, 224, 0.1);
        border-color: rgba(45, 170, 224, 0.3);
      }

      .stat-label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(120deg, #2daae0, #5ec8f2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .comparison-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .model-item {
        background: rgba(0, 0, 0, 0.2);
        padding: 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
        transition: all 0.3s ease;
      }

      .model-item:hover {
        background: rgba(45, 170, 224, 0.15);
        border-color: rgba(45, 170, 224, 0.3);
        transform: translateY(-4px);
      }

      .model-name {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 12px;
        letter-spacing: 0.5px;
      }

      .bar {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #2daae0, #5ec8f2);
        border-radius: 3px;
        transition: width 0.5s ease;
      }

      .latency-value {
        font-size: 18px;
        font-weight: 700;
        color: #2daae0;
      }

      .latency-unit {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
      }

      .live-waveform {
        display: flex;
        align-items: flex-end;
        justify-content: space-around;
        gap: 4px;
        height: 100px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 14px;
        margin-top: 20px;
      }

      .wave-column {
        flex: 1;
        background: linear-gradient(180deg, #5ec8f2 0%, #2daae0 100%);
        border-radius: 2px;
        opacity: 0.6;
        transition: height 0.3s ease;
        min-height: 10px;
      }

      .live-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .indicator-dot {
        width: 10px;
        height: 10px;
        background: #4ade80;
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      @media (max-width: 1200px) {
        .container {
          grid-template-columns: 1fr;
        }

        .chart-wrapper {
          height: 250px;
        }
      }

      @media (max-width: 768px) {
        .header {
          padding: 16px 20px;
        }

        .nav-links {
          display: none;
        }

        .container {
          padding: 20px;
          gap: 20px;
        }

        .page-title {
          font-size: 24px;
        }

        .card {
          padding: 20px;
        }

        .comparison-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">🏠 SmartHome</div>
      <ul class="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </header>

    <div class="container">
      <h1 class="page-title">Model Performance</h1>

      <!-- Chart Card -->
      <div class="card">
        <div class="card-title">Latency Comparison</div>
        <div class="chart-wrapper">
          <canvas id="comparisonChart"></canvas>
        </div>
      </div>

      <!-- Stats Card -->
      <div class="card">
        <div class="card-title">View Controls</div>
        <div class="model-selector">
          <button class="toggle-btn active" data-view="bar">
            📊 Bar Chart
          </button>
          <button class="toggle-btn" data-view="line">📈 Trend Line</button>
        </div>
        <div class="stats-grid" style="margin-top: 24px">
          <div class="stat-card">
            <span class="stat-label">Fastest</span>
            <span class="stat-value" id="fastest">75ms</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Average</span>
            <span class="stat-value" id="average">134ms</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Slowest</span>
            <span class="stat-value" id="slowest">210ms</span>
          </div>
        </div>
      </div>

      <!-- Comparison Grid -->
      <div class="card" style="grid-column: 1 / -1">
        <div class="card-title">All Models</div>
        <div class="comparison-grid" id="comparisonGrid"></div>
      </div>

      <!-- Live Monitor -->
      <div class="card" style="grid-column: 1 / -1">
        <div class="live-indicator">
          <span class="indicator-dot"></span>
          Real-time Latency Monitor
        </div>
        <div class="live-waveform" id="liveWaveform"></div>
      </div>
    </div>

    <script>
      const models = [
        { name: "PhoWhisper-medium", latency: 125, color: "#2daae0" },
        { name: "PhoWhisper-large", latency: 185, color: "#5ec8f2" },
        { name: "Wav2Vec2-base", latency: 95, color: "#0f88c9" },
        { name: "HuBERT-large", latency: 210, color: "#1ba3d6" },
        { name: "Conformer", latency: 75, color: "#24c4f5" },
      ];

      let currentView = "bar";
      let chart = null;

      // Initialize chart
      function initChart() {
        const ctx = document.getElementById("comparisonChart").getContext("2d");

        if (chart) chart.destroy();

        const type = currentView === "bar" ? "bar" : "line";
        const labels = models.map((m) => m.name.split("-")[0]);
        const data = models.map((m) => m.latency);

        chart = new Chart(ctx, {
          type: type,
          data: {
            labels: labels,
            datasets: [
              {
                label: "Latency (ms)",
                data: data,
                backgroundColor: models.map((m) => m.color + "40"),
                borderColor: models.map((m) => m.color),
                borderWidth: 3,
                borderRadius: 8,
                tension: 0.4,
                fill: true,
                backgroundColor: models.map((m) => m.color + "20"),
                pointRadius: 6,
                pointBackgroundColor: models.map((m) => m.color),
                pointBorderColor: "#fff",
                pointBorderWidth: 2,
                pointHoverRadius: 8,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                labels: {
                  color: "rgba(255,255,255,0.8)",
                  font: { size: 12, weight: "600" },
                  padding: 20,
                },
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                max: 250,
                ticks: {
                  color: "rgba(255,255,255,0.6)",
                  font: { size: 11 },
                  callback: (v) => v + "ms",
                },
                grid: {
                  color: "rgba(255,255,255,0.08)",
                  drawBorder: false,
                },
              },
              x: {
                ticks: {
                  color: "rgba(255,255,255,0.6)",
                  font: { size: 11 },
                },
                grid: { display: false },
              },
            },
          },
        });
      }

      // Toggle buttons
      document.querySelectorAll(".toggle-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".toggle-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentView = btn.dataset.view;
          initChart();
        });
      });

      // Initialize comparison grid
      function initComparison() {
        const grid = document.getElementById("comparisonGrid");
        const maxLatency = Math.max(...models.map((m) => m.latency));

        models.forEach((model) => {
          const percentage = (model.latency / maxLatency) * 100;
          const item = document.createElement("div");
          item.className = "model-item";
          item.innerHTML = `
                    <div class="model-name">${model.name}</div>
                    <div class="bar">
                        <div class="bar-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div>
                        <div class="latency-value">${Math.round(model.latency)}</div>
                        <div class="latency-unit">milliseconds</div>
                    </div>
                `;
          grid.appendChild(item);
        });
      }

      // Update stats
      function updateStats() {
        const latencies = models.map((m) => m.latency);
        const min = Math.min(...latencies);
        const max = Math.max(...latencies);
        const avg = Math.round(
          latencies.reduce((a, b) => a + b) / latencies.length,
        );

        document.getElementById("fastest").textContent = min + "ms";
        document.getElementById("average").textContent = avg + "ms";
        document.getElementById("slowest").textContent = max + "ms";
      }

      // Live waveform
      function initLiveWaveform() {
        const container = document.getElementById("liveWaveform");
        for (let i = 0; i < 30; i++) {
          const col = document.createElement("div");
          col.className = "wave-column";
          container.appendChild(col);
        }
        animateLiveWaveform();
      }

      function animateLiveWaveform() {
        const cols = document.querySelectorAll(".wave-column");
        setInterval(() => {
          cols.forEach((col) => {
            col.style.height = Math.random() * 100 + "%";
          });
        }, 300);
      }

      // Real-time updates
      setInterval(() => {
        models.forEach((m) => {
          m.latency += (Math.random() - 0.5) * 30;
          m.latency = Math.max(50, Math.min(250, m.latency));
        });
        updateStats();
      }, 3000);

      // Initialize
      initChart();
      initComparison();
      updateStats();
      initLiveWaveform();
    </script>
  </body>
</html>
