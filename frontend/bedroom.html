<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedroom</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Welcome to the Bedroom</h1>
    </header>
    <div class="container">
      <img
        id="door-image"
        class="bedroom-image"
        src="https://via.placeholder.com/600x400?text=Door+Closed"
        alt="Bedroom Door"
        data-state="closed"
      />
      <button onclick="toggleDoor()">Toggle Door</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
