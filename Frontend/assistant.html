<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Assistant · SmartHome</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at top, #1a1025 0%, #0a0612 60%, #020104 100%);
      min-height: 100vh; color: #f0eaf8; display: flex; flex-direction: column;
    }
    .header {
      position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between;
      align-items: center; padding: 18px 40px; background: rgba(8, 4, 18, .8);
      border-bottom: 1px solid rgba(192, 132, 252, .15); backdrop-filter: blur(20px)
    }
    .logo {
      font-size: 22px; font-weight: 800; background: linear-gradient(120deg, #c084fc, #818cf8, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text
    }
    .nav-links { display: flex; gap: 6px; list-style: none }
    .nav-links a {
      text-decoration: none; color: rgba(255, 255, 255, .55); font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .8px; padding: 8px 16px; border-radius: 10px; transition: all .3s
    }
    .nav-links a:hover, .nav-links a.active { color: #c084fc; background: rgba(192, 132, 252, .12) }
    
    .chat-container {
      flex: 1; max-width: 800px; margin: 30px auto; width: 100%; display: flex; flex-direction: column;
      background: rgba(255, 255, 255, .03); border: 1px solid rgba(192, 132, 252, .15);
      border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
    }
    .chat-header {
      padding: 20px; background: rgba(0, 0, 0, .3); border-bottom: 1px solid rgba(255, 255, 255, .05);
      text-align: center; font-weight: 700; color: #a78bfa; letter-spacing: 1px;
    }
    .chat-box {
      flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; height: 500px;
    }
    .msg { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
    .msg.bot { background: rgba(124, 58, 237, .15); border: 1px solid rgba(167, 139, 250, .2); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.user { background: linear-gradient(135deg, #7c3aed, #4f46e5); align-self: flex-end; border-bottom-right-radius: 4px; }
    
    .input-area {
      padding: 20px; background: rgba(0, 0, 0, .3); border-top: 1px solid rgba(255, 255, 255, .05);
      display: flex; gap: 15px; align-items: center; justify-content: center;
    }
    
    .mic-button {
      width: 80px; height: 80px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #c084fc, #7c3aed); color: white; font-size: 30px;
      cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(124, 58, 237, 0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .mic-button:hover { transform: scale(1.05); }
    .mic-button.recording {
      background: #f43f5e; box-shadow: 0 0 30px rgba(244, 63, 94, 0.6);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    .status-text { text-align: center; font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 10px; height: 20px;}
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">🏠 SmartHome</div>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="assistant.html" class="active">Assistant</a></li>
    </ul>
  </header>

  <div class="chat-container">
    <div class="chat-header">🤖 TRỢ LÝ ẢO THÔNG</div>
    <div class="chat-box" id="chatBox">
      <div class="msg bot">Dạ, em chào anh Thành! Anh cần em giúp gì ạ?</div>
    </div>
    
    <div style="padding: 0 20px;">
      <div class="status-text" id="statusText">Bấm vào Micro để bắt đầu nói</div>
    </div>

    <div class="input-area">
      <button class="mic-button" id="micBtn">🎤</button>
    </div>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const chatBox = document.getElementById('chatBox');
    
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let isBotBusy = false; // 💡 Ổ KHÓA TỔNG CHỐNG XUNG ĐỘT MICRO
    let stream;

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };

    function speakText(text, onFinish = null) {
      window.speechSynthesis.cancel(); 
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = 1.0; // Giảm tốc độ xuống 1.0 cho tròn vành rõ chữ
      
      const voices = window.speechSynthesis.getVoices();
      
      const viVoice = voices.find(voice => 
          voice.name.includes('HoaiMy') || // Giọng nữ rất hay của Windows Edge
          voice.name.includes('An') ||     // Giọng nam của Windows Edge
          voice.name.includes('Google Tiếng Việt') || // Giọng chuẩn của Chrome
          voice.lang === 'vi-VN' || 
          voice.lang === 'vi_VN'
      );
      
      if (viVoice) {
          utterance.voice = viVoice;
      } else {
          console.warn("⚠️ Không tìm thấy giọng Tiếng Việt, đang dùng giọng mặc định.");
      }

      if (onFinish) {
          utterance.onend = onFinish;
      }

      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // CƠ CHẾ 1: GHI ÂM
    // ==========================================
    async function startRecording(autoStopMs = 0) {
      if (isRecording) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = processAudio;
        mediaRecorder.start();
        
        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.innerHTML = "⏹️";
        
        if (autoStopMs > 0) {
           statusText.innerHTML = `🔴 Đang nghe... <b>(Tự ngắt sau ${autoStopMs/1000}s)</b>`;
           setTimeout(() => { if (isRecording) stopRecording(); }, autoStopMs);
        } else {
           statusText.innerHTML = "🔴 Đang nghe... <b>(Bấm lần nữa để gửi)</b>";
        }
      } catch (err) {
        alert("Lỗi truy cập Micro: " + err.message);
        resumeWakeword(); // Bật lại nghe lén nếu lỗi
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      mediaRecorder.stop();
      stream.getTracks().forEach(track => track.stop());
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = "🎤";
      statusText.innerHTML = "⏳ Đang gửi cho AI phân tích...";
    }

    micBtn.addEventListener('click', () => {
      if (!isRecording) {
         if (!isBotBusy) {
             isBotBusy = true;
             if (wakewordListener) wakewordListener.stop();
             startRecording(0); 
         }
      } else {
         stopRecording();
      }
    });

    // Hàm dùng chung để khôi phục trạng thái nghe lén an toàn
    function resumeWakeword() {
       isBotBusy = false;
       if (wakewordListener) {
           try { wakewordListener.start(); } catch(e) {} // Bắt lỗi crash ngầm của DOM
       }
    }

    // ==========================================
    // CƠ CHẾ 2: XỬ LÝ LÕI AI (PhoWhisper + Gemini)
    // ==========================================
    async function processAudio() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', audioBlob);

      try {
        statusText.innerHTML = "⏳ Đang phân tích giọng nói...";
        const sttRes = await fetch('http://127.0.0.1:5000/api/command', { method: 'POST', body: formData });
        const sttData = await sttRes.json();
        const userText = sttData.text;

        if (!userText || userText.trim() === "") {
          statusText.innerHTML = "⚠️ Không nghe rõ, vui lòng thử lại!";
          resumeWakeword();
          return;
        }

        addMessage(userText, 'user');
        statusText.innerHTML = "⏳ Trợ lý Thông đang suy nghĩ...";
        
        const geminiRes = await fetch('http://127.0.0.1:5000/api/chatbot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: userText })
        });
        const geminiData = await geminiRes.json();

        addMessage(geminiData.reply, 'bot');
        statusText.innerHTML = "✅ Xong! Bạn có thể gọi 'Ê Thông' để hỏi tiếp.";

        // 💡 CHIÊU QUAN TRỌNG: Chỉ bật lại nghe lén KHI VÀ CHỈ KHI loa đã đọc xong toàn bộ câu
        speakText(geminiData.reply, () => {
            resumeWakeword();
        });

      } catch (err) {
        console.error(err);
        statusText.innerHTML = "❌ Lỗi kết nối đến Backend Server!";
        resumeWakeword();
      } 
    }

    // ==========================================
    // CƠ CHẾ 3: ĐÁNH THỨC WAKEWORD Ở TRANG ASSISTANT
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let wakewordListener = null;

    if (SpeechRecognition) {
      wakewordListener = new SpeechRecognition();
      wakewordListener.continuous = true;
      wakewordListener.lang = 'vi-VN';
      wakewordListener.interimResults = false;

      wakewordListener.onresult = (event) => {
        const last = event.results.length - 1;
        const transcript = event.results[last][0].transcript.toLowerCase();
        
        const triggers = ['ê thông', 'hey thông', 'nghe thông', 'này thông', 'thông ơi'];
        
        if (triggers.some(keyword => transcript.includes(keyword))) {
           if (!isBotBusy) {
               isBotBusy = true; // Khóa hệ thống không cho nghe lén nữa
               wakewordListener.stop(); 
               
               // Chỉ khi loa đọc xong chữ "Dạ", Micro thu âm mới được phép bật lên
               speakText("Dạ", () => {
                   startRecording(6000); 
               });
           }
        }
      };
      
      wakewordListener.onend = () => {
         // Nếu AI đang không bận gì cả mà tự dưng API nghe lén bị tắt, thì tự động bật lại
         if (!isBotBusy) {
             try { wakewordListener.start(); } catch(e) {}
         }
      };
      
      wakewordListener.start();
    } 

    // =================================================================
    // KHI NHẢY TỪ TRANG HOME SANG QUA NÚT BẤM HOẶC LỆNH GIỌNG NÓI
    // =================================================================
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      
      if (urlParams.get('trigger') === 'true') {
        window.history.replaceState({}, document.title, window.location.pathname);
        
        isBotBusy = true; // Khóa hệ thống nghe lén
        if (wakewordListener) wakewordListener.stop(); 

        addMessage("Dạ, em nghe đây ạ! Mời anh Thành nói lệnh.", "bot");
        
        // Đọc xong lời chào thì bật mic luôn
        speakText("Dạ, em nghe đây", () => {
           startRecording(6000); 
        });
      }
    });
  </script>
</body>
</html>
